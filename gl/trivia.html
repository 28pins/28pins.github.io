<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Questions</title>
    <link rel="stylesheet" href="../src/style.css">
</head>

<body>
    <div class="card">
        <header>
            <h1>Trivia Questions</h1>
            <h2 id="progress">Question 1 of 12</h2>
        </header>

        <div id="trivia-container" class="trivia-container">
            <!-- Question card will be dynamically inserted here -->
        </div>

        <div id="results-container" class="results-container" style="display: none;">
            <h2>Results</h2>
            <p id="results-message"></p>
            <div id="missed-questions" class="missed-questions"></div>
            <button id="retry-btn" class="btn-retry">Retry All Questions</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let missedIndices = [];

        function renderQuestion() {
            const container = document.getElementById('trivia-container');
            const question = questions[currentIndex];
            const isAnswered = userAnswers[currentIndex] !== undefined;
            const isCorrect = isAnswered && userAnswers[currentIndex] === question.answer;
            const borderClass = isAnswered ? (isCorrect ? 'correct-answer-border' : 'incorrect-answer-border') : '';

            const questionCard = `
                <div class="trivia-card ${question.answer.toLowerCase()} ${borderClass}">
                    <div class="trivia-card-inner">
                        <p class="trivia-statement">${question.statement}</p>
                        
                        <h3 class="youth-said-heading">The Youth Said:</h3>
                        <div class="trivia-buttons">
                            <button class="btn-true ${isAnswered && userAnswers[currentIndex] === 'True' ? 'selected' : ''}" ${isAnswered ? 'disabled' : ''} onclick="answerQuestion('True')">True</button>
                            <button class="btn-false ${isAnswered && userAnswers[currentIndex] === 'False' ? 'selected' : ''}" ${isAnswered ? 'disabled' : ''} onclick="answerQuestion('False')">False</button>
                        </div>

                        ${isAnswered ? `
                            <div class="trivia-feedback ${isCorrect ? 'correct' : 'incorrect'}">
                                <p class="feedback-text">${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</p>
                                <p class="correct-answer">The answer is: <strong>${question.answer}</strong></p>
                                <p class="context">${question.context}</p>
                            </div>
                            <button class="btn-next" onclick="nextQuestion()">Next →</button>
                        ` : ''}
                    </div>
                </div>
            `;

            container.innerHTML = questionCard;
            document.getElementById('progress').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
        }

        function answerQuestion(answer) {
            userAnswers[currentIndex] = answer;
            const question = questions[currentIndex];

            if (answer !== question.answer) {
                if (!missedIndices.includes(currentIndex)) {
                    missedIndices.push(currentIndex);
                }
            } else {
                missedIndices = missedIndices.filter(i => i !== currentIndex);
            }

            renderQuestion();
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            const container = document.getElementById('trivia-container');
            const resultsContainer = document.getElementById('results-container');
            const resultsMessage = document.getElementById('results-message');
            const missedQuestionsDiv = document.getElementById('missed-questions');

            container.style.display = 'none';
            resultsContainer.style.display = 'block';

            if (missedIndices.length === 0) {
                resultsMessage.innerHTML = `<strong>🎉 Perfect! All ${questions.length} questions correct!</strong>`;
                document.getElementById('retry-btn').style.display = 'none';
            } else {
                resultsMessage.innerHTML = `<strong>${missedIndices.length} question${missedIndices.length !== 1 ? 's' : ''} missed. Start over and try again!</strong>`;

                let missedHTML = '<div class="missed-list">';
                missedIndices.forEach(idx => {
                    const q = questions[idx];
                    missedHTML += `
                        <div class="missed-item ${q.answer.toLowerCase()}">
                            <p><strong>Q${idx + 1}:</strong> ${q.statement}</p>
                            <p class="correct-answer">Correct answer: <strong>${q.answer}</strong></p>
                        </div>
                    `;
                });
                missedHTML += '</div>';
                missedQuestionsDiv.innerHTML = missedHTML;
            }
        }

        function retry() {
            currentIndex = 0;
            userAnswers = [];
            missedIndices = [];
            document.getElementById('trivia-container').style.display = 'block';
            document.getElementById('results-container').style.display = 'none';
            renderQuestion();
        }

        document.getElementById('retry-btn').addEventListener('click', retry);

        // Load questions from JSON file
        fetch('trivia-data.json')
            .then(response => response.json())
            .then(data => {
                questions = data;
                renderQuestion();
            })
            .catch(error => {
                console.error('Error loading trivia data:', error);
                document.getElementById('trivia-container').innerHTML = '<p>Error loading questions. Please refresh the page.</p>';
            });
    </script>
</body>

</html>
